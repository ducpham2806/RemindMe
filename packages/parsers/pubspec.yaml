name: remindme_parsers
description: Đọc câu tự nhiên và tài liệu trên máy (NLU luật, decoder, mẫu nhà cung cấp). Dart thuần, không gọi AI API (ADR-010).
publish_to: none
resolution: workspace
environment:
  sdk: ^3.10.0
dependencies:
  archive: ^4.7.1
  remindme_core: any
  xml: '>=6.5.0 <8.0.0' # 6.x để tương thích flutter_svg (vector_graphics_compiler) trong app
  yaml: ^3.1.2
dev_dependencies:
  test: ^1.25.0

# Gói ngữ pháp đóng sẵn trong app (bản cập nhật tải qua CDN có chữ ký sau này). App đọc: packages/remindme_parsers/nlu/packs/<lang>.yaml
flutter:
  assets:
    - nlu/packs/en.yaml
    - nlu/packs/vi.yaml
    - data/airports.tsv
