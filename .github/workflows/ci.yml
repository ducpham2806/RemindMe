name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs-and-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tham chiếu trong docs
        run: python3 tools/check-docs.py
      - name: Bộ mẫu tài liệu (schema + ẩn danh)
        run: python -m pip install -q "jsonschema>=4.10" && python tools/validate-fixtures.py
      - name: Chuỗi hard-code trong Flutter
        run: python3 tools/lint-hardcoded-strings.py

  db:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cài Postgres 16 + pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo systemctl start postgresql
          sudo -u postgres psql -q -c "alter user postgres password 'postgres'"
      - name: Migrations + pgTAP
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: tools/db-test.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - name: Contract test SyncEngine ↔ RPC Postgres
        env:
          REMINDME_PG: "1"
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          flutter pub get
          cd packages/data && dart test test/pg_contract_test.dart

  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - name: ARB, pseudo-locale, quy tắc nền tảng
        run: |
          python3 tools/check-arb.py
          python3 tools/pseudo-arb.py --check
          python3 tools/lint-platform-checks.py
      - run: flutter pub get
      - run: cd apps/client && flutter gen-l10n
      - run: flutter analyze
      - name: "Test package Dart thuần (chạy trong từng package vì sqlite3 dùng native assets)"
        run: for p in core platform data parsers; do (cd packages/$p && dart test) || exit 1; done
      - name: Test widget (3 kích thước, pseudo-locale)
        run: cd apps/client && flutter test

  # Kiểm cấu hình native (manifest, desugaring, plugin): runner ubuntu có sẵn Android SDK.
  android-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: cd apps/client && flutter build apk --debug

  # macOS tốn phút gấp nhiều lần: chỉ chạy khi bấm tay (Actions → ci → Run workflow).
  ios-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: cd apps/client && flutter build ios --debug --no-codesign
