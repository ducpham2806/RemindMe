include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    - lib/l10n/app_localizations*.dart   # sinh bởi flutter gen-l10n
    - android/**
    - ios/**

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - unawaited_futures
