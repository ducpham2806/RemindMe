name: remindme_client
description: RemindMe app (Android, iOS, iPadOS; macOS/Windows ở Phase 4 theo ADR-014).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  archive: ^4.7.1
  cupertino_ui: ^1.1.7
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.2.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  remindme_core: any
  remindme_data: any
  remindme_parsers: any
  remindme_platform: any
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/fonts/OFL.txt
  # design-system.md §3: Be Vietnam Pro (OFL), đủ 4 độ đậm dùng trong Figma.
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
